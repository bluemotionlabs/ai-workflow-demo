name: AI Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .claude/commands/review.md)

          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}" > /tmp/review-output.txt 2>&1 || true
          cat /tmp/review-output.txt

      - name: Post review as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/review-output.txt ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review-output.txt
          else
            echo "No review output to post"
          fi
